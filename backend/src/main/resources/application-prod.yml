spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-init-sql: "BEGIN EXECUTE IMMEDIATE 'ALTER SESSION SET TIME_ZONE = ''America/Bogota'''; EXECUTE IMMEDIATE 'ALTER SESSION SET CURRENT_SCHEMA = MEDITRIAJE_OWNER'; END;"
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    user: ${FLYWAY_USER:${DB_USER}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}

cors:
  origins: ${CORS_ORIGINS}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

security:
  cookie:
    secure: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
    refresh-expiration-days: 7

app:
  frontend-url: ${FRONTEND_URL:https://meditriaje.com}

meditriaje:
  mail:
    transport: ${MAIL_TRANSPORT:brevo-api}
    brevo:
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      api-key: ${BREVO_API_KEY}
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME}
  demo:
    seed: ${DEMO_SEED:false}
    password: ${DEMO_PASSWORD:}
    reset: ${DEMO_RESET:false}



