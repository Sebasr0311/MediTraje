spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-init-sql: "BEGIN EXECUTE IMMEDIATE 'ALTER SESSION SET TIME_ZONE = ''America/Bogota'''; EXECUTE IMMEDIATE 'ALTER SESSION SET CURRENT_SCHEMA = MEDITRIAJE_OWNER'; END;"
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}

cors:
  origins: ${CORS_ORIGINS}

management:
  endpoint:
    health:
      show-details: when-authorized

security:
  cookie:
    secure: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
    refresh-expiration-days: 7

