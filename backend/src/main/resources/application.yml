spring:
  application:
    name: meditriaje-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
    default: dev
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:database/migrations
    user: ${FLYWAY_USER:MEDITRIAJE_OWNER}
    password: ${FLYWAY_PASSWORD:}
    baseline-on-migrate: true
    validate-on-migrate: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: MediTriajeHikariPool
      connection-test-query: SELECT 1 FROM DUAL
      connection-init-sql: "BEGIN EXECUTE IMMEDIATE 'ALTER SESSION SET TIME_ZONE = ''America/Bogota'''; EXECUTE IMMEDIATE 'ALTER SESSION SET CURRENT_SCHEMA = MEDITRIAJE_OWNER'; END;"
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      initialization-fail-timeout: -1

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:${BREVO_SMTP_LOGIN:${SMTP_FROM:}}}
    password: ${SMTP_PASSWORD:${BREVO_API_KEY:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mail:
  from: ${MAIL_FROM:${SMTP_FROM:no-reply@meditriaje.com}}
  from-name: ${MAIL_FROM_NAME:${SMTP_FROM_NAME:MediTriaje 2.0}}

meditriaje:
  mail:
    transport: ${MAIL_TRANSPORT:brevo-api}
    brevo:
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:${SMTP_FROM:no-reply@meditriaje.com}}
    from-name: ${MAIL_FROM_NAME:${SMTP_FROM_NAME:MediTriaje 2.0}}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5500}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

cors:
  origins: ${CORS_ORIGINS}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
    refresh-expiration-days: 7

logging:
  level:
    root: INFO
    com.meditriaje: INFO
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
