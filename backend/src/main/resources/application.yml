spring:
  application:
    name: meditriaje-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.flywaydb.core.FlywayAutoConfiguration # Se habilitará en M1.3
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:MEDITRIAJE_APP}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: MediTriajeHikariPool
      connection-test-query: SELECT 1 FROM DUAL
      connection-init-sql: "BEGIN EXECUTE IMMEDIATE 'ALTER SESSION SET TIME_ZONE = ''America/Bogota'''; EXECUTE IMMEDIATE 'ALTER SESSION SET CURRENT_SCHEMA = MEDITRIAJE_OWNER'; END;"
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      initialization-fail-timeout: -1

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
