services:
  - type: web
    name: meditriaje-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        value: MEDITRIAJE_APP
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_USER
        value: MEDITRIAJE_OWNER
      - key: FLYWAY_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: meditraje.admin@gmail.com
      - key: MAIL_FROM_NAME
        value: MediTriaje 2.0
      - key: SMTP_FROM
        value: meditraje.admin@gmail.com
      - key: SMTP_FROM_NAME
        value: MediTriaje 2.0
