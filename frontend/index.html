<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediTriaje 2.0 — Plataforma de Triaje, Citas e Historia Clínica</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Enlace accesible de salto al contenido -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <!-- Barra de Navegación Superior -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="#/" class="navbar-brand" aria-label="Ir al inicio de MediTriaje 2.0">
        <svg class="icon icon-hospital text-primary" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 6v4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h-4"/><path d="M6 12h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M10 22v-4h4v4"/>
        </svg>
        <span>MediTriaje</span>
      </a>

      <!-- Acciones de Navegación y Sesión -->
      <nav aria-label="Navegación principal" class="flex items-center gap-3">
        <div id="nav-auth-links" class="flex items-center gap-2">
          <!-- Se actualiza dinámicamente según la sesión -->
          <a href="#/login" class="nav-link font-medium">Iniciar sesión</a>
          <a href="#/register" class="btn btn-primary btn--sm">Registrarme</a>
        </div>

        <!-- Botón de Alternancia de Tema Claro / Oscuro -->
        <button id="themeToggleBtn" type="button" class="btn btn-secondary btn--sm btn--icon-only" aria-label="Alternar tema claro y oscuro" title="Alternar tema">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <span id="themeToggleText" class="sr-only">Modo Oscuro</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Contenedor Principal de la SPA -->
  <main id="main-content" class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-16);">
    <div id="app"></div>
  </main>

  <!-- Barra de Navegación Inferior Móvil (Para pacientes autenticados) -->
  <nav class="bottom-nav" id="bottom-nav" style="display: none;" aria-label="Navegación móvil del paciente">
    <a href="#/patient/dashboard" class="bottom-nav-item is-active">
      <svg class="icon icon-hospital" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h-4"/><path d="M6 12h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M10 22v-4h4v4"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#/patient/triage" class="bottom-nav-item">
      <svg class="icon icon-activity" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Triaje</span>
    </a>
    <a href="#/patient/appointments" class="bottom-nav-item">
      <svg class="icon icon-calendar" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Citas</span>
    </a>
    <a href="#/patient/history" class="bottom-nav-item">
      <svg class="icon icon-file-text" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Historia</span>
    </a>
    <a href="#/patient/prescriptions" class="bottom-nav-item">
      <svg class="icon icon-pill" viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      <span>Recetas</span>
    </a>
  </nav>

  <!-- Región Accesible para Notificaciones Toast -->
  <div id="toast-container" class="toast-container" role="region" aria-label="Notificaciones del sistema"></div>

  <!-- Contenedor Dinámico para Modales -->
  <div id="modal-container"></div>

  <!-- Script Modular de la Aplicación -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
